<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Errata incorrecta</title>
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Georgia", "Times New Roman", serif;
        }
        .title-container {
            font-size: 3rem;
            font-weight: normal;
            color: #000000;
            letter-spacing: 1px;
        }
        .cursor {
            display: inline-block;
            width: 3px;
            height: 3.5rem;
            background-color: #000000;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            from, to { background-color: transparent }
            50% { background-color: #000000; }
        }
    </style>
</head>
<body>
    <div class="title-container">
        Errata incorrecta<span class="cursor"></span>
    </div>
</body>
</html>
